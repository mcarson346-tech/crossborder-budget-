<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123247"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="跨境預算"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>跨境收支預算</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#183044;background:#eef3f7}*{box-sizing:border-box}body{margin:0}main{max-width:480px;min-height:100dvh;margin:auto;padding:18px 15px calc(88px + env(safe-area-inset-bottom));background:#f6f8fb}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted,.hint{color:#607589;font-size:12px;line-height:1.55}.card{background:#fff;border-radius:17px;padding:16px;margin:14px 0;box-shadow:0 3px 15px #18364c0a}.hero{background:#123247;color:#fff}.hero .muted{color:#b8cbd9}.hero strong{display:block;font-size:29px;margin:8px 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.stat{background:#eff5f8;border-radius:12px;padding:12px}.stat strong{display:block;margin-top:4px;font-size:16px}.pill{font-size:12px;border-radius:20px;background:#dff2ed;color:#087366;padding:6px 9px;white-space:nowrap}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select{font:inherit;width:100%;min-width:0;height:46px;border:1px solid #cfdae4;border-radius:11px;background:#fff;color:#183044;padding:10px 11px;font-size:16px;line-height:24px}input[type=date],input[type=month]{display:block;appearance:none;-webkit-appearance:none;color-scheme:light;line-height:24px;overflow:hidden}input::-webkit-date-and-time-value{text-align:left;min-width:0;height:24px}input::-webkit-calendar-picker-indicator{opacity:1;width:23px;height:23px;margin:0;flex:0 0 23px}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}.primary,.secondary,.danger{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 13px}.primary{width:100%;background:#087d72;color:#fff;font-weight:700;margin-top:14px}.secondary{background:#e9f0f4;color:#26475b}.danger{background:#fff0ee;color:#a63b35}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:12px}.entry{border-top:1px solid #edf1f3;display:flex;gap:6px;align-items:center;padding:11px 0}.entry .grow{flex:1;min-width:0;overflow-wrap:anywhere}.entry b,.entry small{display:block}.entry small{font-size:11px;color:#678094;margin-top:4px}.entry button{font-size:12px;padding:7px}.amount{font-weight:700;white-space:nowrap}.income{color:#0a846e}.expense{color:#af4841}.right{text-align:right}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);display:flex;background:#fff;border-top:1px solid #e4eaef;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:3}.tabs button{font:inherit;flex:1;border:0;background:transparent;color:#687b8a;font-size:12px;padding:10px 0}.tabs button.active{color:#07806e;font-weight:750}.hidden{display:none!important}.budget{border-top:1px solid #e9eef2;padding:12px 0}.budget:first-child{border:0}.bar{height:8px;background:#e8edf0;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#0ba487}.bar i.over{background:#dc5c4f}.notice{background:#f1f7fb;border-radius:10px;padding:10px;margin:9px 0}.wide{width:100%}.chartrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:8px;margin:11px 0;font-size:13px}.charttrack{height:18px;border-radius:8px;background:#eaf0f3;overflow:hidden}.chartbar{height:100%;min-width:0;border-radius:8px;background:#138c7d}.chartrow:nth-child(3) .chartbar{background:#4c85b5}.chartrow:nth-child(4) .chartbar{background:#8d6bb7}.chartvalue{font-size:12px;color:#465f73;white-space:nowrap}.budget-money{font-size:17px;font-weight:750;margin-top:4px}.install{margin-top:8px}.install button{font-size:12px}.settingless{color:#7890a0}
</style></head><body><main><header><div><h1>跨境收支預算</h1><span class="muted">深圳生活 · 香港工作</span></div><span class="pill" id="monthTag"></span></header>
<section id="home"><div class="card hero"><span class="muted">本月結餘（港幣參考值）</span><strong id="balance"></strong><div class="grid"><div><span class="muted">收入</span><div id="incomeTotal"></div></div><div><span class="muted">支出</span><div id="expenseTotal"></div></div></div></div><div class="card"><div class="row"><h2>參考匯率</h2><button class="secondary" id="refreshRate" type="button">更新</button></div><div id="rateStatus" class="notice hint"></div><div class="hint">市場中間參考價；非即時交易報價。離線時使用最後成功取得的匯率。</div></div><div class="card"><h2>本月各使用者支出</h2><div id="userChart"></div><p class="hint">以每筆交易記錄的匯率折合港幣，僅計支出。</p></div><div class="card"><h2>本月概覽</h2><div class="grid"><div class="stat"><span class="muted">香港支出</span><strong id="hkSpend"></strong></div><div class="stat"><span class="muted">深圳支出</span><strong id="szSpend"></strong></div><div class="stat"><span class="muted">交通支出</span><strong id="transportSpend"></strong></div><div class="stat"><span class="muted">預算餘額</span><strong id="budgetLeft"></strong></div></div><p class="hint">每筆人民幣交易保存當時匯率；市場更新不會改寫舊帳。</p></div><div class="card"><div class="row"><h2>最近交易</h2><button class="secondary" type="button" data-nav="history">全部</button></div><div id="recent"></div></div><div class="install" id="installArea"></div></section>
<section id="add" class="hidden"><div class="card"><h2 id="formTitle">新增交易</h2><form id="entryForm"><div class="formgrid"><div><label for="type">類型</label><select id="type"><option value="expense">支出</option><option value="income">收入</option></select></div><div><label for="date">日期</label><input id="date" type="date" required></div><div><label for="amount">金額</label><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00"></div><div><label for="currency">幣種</label><select id="currency"><option value="HKD">港幣 HKD</option><option value="CNY">人民幣 CNY</option></select></div><div><label for="place">地點</label><select id="place"><option>香港</option><option>深圳</option><option>其他</option></select></div><div><label for="user">使用者</label><select id="user"><option>自己</option><option>伴侶</option><option>共用</option><option>其他</option></select></div><div><label for="category">分類</label><select id="category"></select></div></div><label for="note">備註</label><input id="note" maxlength="80" placeholder="例如：跨境巴士、深圳房租"><div id="rateBox" class="hidden"><label for="txRate">此筆匯率：1 人民幣 = ? 港幣</label><input id="txRate" type="number" inputmode="decimal" min="0.0001" step="any"><div class="hint">自動填入最新參考匯率；可改為實際成交匯率。</div></div><button class="primary" type="submit" id="submitEntry">儲存交易</button><button class="secondary wide hidden" type="button" id="cancelEdit" style="margin-top:8px">取消修改</button></form></div></section>
<section id="history" class="hidden"><div class="card"><h2>交易紀錄</h2><div class="formgrid"><div><label for="filterMonth">月份</label><input id="filterMonth" type="month"></div><div><label for="filterType">類型</label><select id="filterType"><option value="all">全部</option><option value="expense">支出</option><option value="income">收入</option></select></div></div><div id="entries"></div></div></section>
<section id="plan" class="hidden"><div class="card"><h2>每月支出預算</h2><p class="hint">每項預算可選港幣或人民幣；圖表按原幣比較。新增、修改、刪除會套用到所有月份，刪除不會影響交易。</p><div id="budgets"></div><form id="budgetForm"><h2 id="budgetTitle">新增預算</h2><label for="budgetName">分類名稱</label><input id="budgetName" maxlength="24" required placeholder="例如：跨境交通"><div class="formgrid"><div><label for="budgetLimit">每月額度</label><input id="budgetLimit" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0.00"></div><div><label for="budgetCurrency">幣種</label><select id="budgetCurrency"><option value="HKD">港幣 HKD</option><option value="CNY">人民幣 CNY</option></select></div></div><button class="primary" id="budgetSubmit" type="submit">新增預算</button><button class="secondary wide hidden" id="cancelBudget" type="button" style="margin-top:8px">取消修改</button></form></div></section>
</main><nav class="tabs" aria-label="主選單"><button data-tab="home" class="active">總覽</button><button data-tab="add">＋記帳</button><button data-tab="history">紀錄</button><button data-tab="plan">預算</button></nav>
<script>
'use strict';const KEY='crossborder-budget-v3',RATE_URL='https://api.frankfurter.dev/v2/rate/CNY/HKD',baseExpense=['住房','飲食','交通','購物','醫療','通訊','其他'],incomeCats=['薪金','兼職','其他收入'],users=['自己','伴侶','共用','其他'];const fresh=()=>({entries:[],budgets:{},rate:0,rateDate:'',rateFetched:0});const $=id=>document.getElementById(id);let editingId=null,editingBudget=null,loadingRate=false,deferredPrompt=null;
function migrate(d){if(!d||!Array.isArray(d.entries)||!d.budgets||typeof d.budgets!=='object')return fresh();const budgets={};for(const [name,val] of Object.entries(d.budgets)){if(typeof val==='object'&&val&&Number(val.limit)>=0)budgets[name]={limit:Number(val.limit),currency:val.currency==='CNY'?'CNY':'HKD'};else if(Number(val)>0)budgets[name]={limit:Number(val),currency:'HKD'}}return{entries:d.entries.map(e=>({...e,user:users.includes(e.user)?e.user:'自己'})),budgets,rate:Number(d.rate)>0?Number(d.rate):0,rateDate:typeof d.rateDate==='string'?d.rateDate:'',rateFetched:Number(d.rateFetched)||0}}function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('crossborder-budget-v1')||'null'))}catch{return fresh()}}let state=load();
function localToday(){const d=new Date(),t=new Date(d.getTime()-d.getTimezoneOffset()*60000);return t.toISOString().slice(0,10)}const month=()=>localToday().slice(0,7),money=(n,c='HKD')=>new Intl.NumberFormat('en-HK',{style:'currency',currency:c}).format(n),escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('自動儲存失敗：瀏覽器儲存空間可能不足。');return false}}function commit(fn){const old=structuredClone(state);fn();if(!save()){state=old;return false}render();return true}
function categories(){const prior=$('category').value,arr=$('type').value==='income'?incomeCats:[...new Set([...baseExpense,...Object.keys(state.budgets),...state.entries.filter(e=>e.type==='expense').map(e=>e.category)])];$('category').innerHTML=arr.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('');if(arr.includes(prior))$('category').value=prior}
function rateUI(){const cny=$('currency').value==='CNY';$('rateBox').classList.toggle('hidden',!cny);$('txRate').required=cny;if(cny&&!Number($('txRate').value)&&state.rate>0)$('txRate').value=state.rate}
function resetForm(){editingId=null;$('entryForm').reset();$('date').value=localToday();$('txRate').value=state.rate||'';$('formTitle').textContent='新增交易';$('submitEntry').textContent='儲存交易';$('cancelEdit').classList.add('hidden');categories();rateUI()}
function showTab(tab){if(tab==='add'&&editingId===null)resetForm();for(const name of ['home','add','history','plan'])$(name).classList.toggle('hidden',name!==tab);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();scrollTo(0,0)}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));document.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)showTab(b.dataset.nav)});
async function updateRate(force=false){if(loadingRate)return;if(!force&&state.rate>0&&Date.now()-state.rateFetched<6*3600000){renderRate();return}loadingRate=true;$('refreshRate').disabled=true;$('rateStatus').textContent='正在取得最新可用匯率…';try{const con=new AbortController(),t=setTimeout(()=>con.abort(),10000);let r;try{r=await fetch(RATE_URL,{cache:'no-store',signal:con.signal})}finally{clearTimeout(t)}if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.base!=='CNY'||d.quote!=='HKD'||!Number.isFinite(Number(d.rate))||Number(d.rate)<=0)throw Error('資料格式無效');const prior=state.rate;if(!commit(()=>{state.rate=Number(d.rate);state.rateDate=d.date||'';state.rateFetched=Date.now()}))throw Error('儲存失敗');if($('currency').value==='CNY'&&editingId===null&&(!Number($('txRate').value)||Number($('txRate').value)===prior))$('txRate').value=state.rate}catch(e){$('rateStatus').textContent=state.rate?'更新失敗；沿用最後已儲存匯率。':'暫時無法取得匯率；可在人民幣交易手動輸入。'}finally{loadingRate=false;$('refreshRate').disabled=false;if(state.rate)renderRate()}}
function renderRate(){$('rateStatus').textContent=state.rate?`1 CNY ≈ ${money(state.rate)} · 資料日期：${state.rateDate||'未提供'} · 上次取得：${state.rateFetched?new Date(state.rateFetched).toLocaleString('zh-HK'):'未知'}`:'尚無匯率。'}$('refreshRate').addEventListener('click',()=>updateRate(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateRate()});$('type').addEventListener('change',categories);$('currency').addEventListener('change',rateUI);$('place').addEventListener('change',()=>{$('currency').value=$('place').value==='深圳'?'CNY':'HKD';rateUI()});
const converted=e=>Number(e.amount)*(e.currency==='CNY'?Number(e.rate):1),sum=a=>a.reduce((s,e)=>s+converted(e),0),sameMonth=(e,m)=>String(e.date||'').slice(0,7)===m,originalSum=(a,c)=>a.filter(e=>e.currency===c).reduce((s,e)=>s+Number(e.amount),0);
function entryHTML(e){return `<div class="entry"><div class="grow"><b>${escapeHTML(e.category)}${e.note?' · '+escapeHTML(e.note):''}</b><small>${escapeHTML(e.date)} · ${escapeHTML(e.place)} · ${escapeHTML(e.user||'自己')} · ${escapeHTML(e.currency)}${e.currency==='CNY'?' · 匯率 '+escapeHTML(e.rate):''}</small></div><div class="right"><div class="amount ${e.type}">${e.type==='income'?'+':'−'}${money(Number(e.amount),e.currency)}</div><small>≈ ${money(converted(e))}</small></div><button class="secondary" type="button" data-edit="${escapeHTML(e.id)}">修改</button><button class="danger" type="button" data-delete="${escapeHTML(e.id)}">刪除</button></div>`}
function render(){const m=month(),current=state.entries.filter(e=>sameMonth(e,m)),exp=current.filter(e=>e.type==='expense'),inc=current.filter(e=>e.type==='income'),spent=sum(exp),budgetHkd=Object.values(state.budgets).reduce((s,b)=>s+(b.currency==='CNY'?b.limit*(state.rate||0):b.limit),0);$('monthTag').textContent=m;$('balance').textContent=money(sum(inc)-spent);$('incomeTotal').textContent=money(sum(inc));$('expenseTotal').textContent=money(spent);$('hkSpend').textContent=money(sum(exp.filter(e=>e.place==='香港')));$('szSpend').textContent=money(sum(exp.filter(e=>e.place==='深圳')));$('transportSpend').textContent=money(sum(exp.filter(e=>e.category==='交通')));$('budgetLeft').textContent=money(budgetHkd-spent);renderRate();const byUser=Object.fromEntries(users.map(u=>[u,sum(exp.filter(e=>(e.user||'自己')===u))]));const max=Math.max(...Object.values(byUser),1);$('userChart').innerHTML=users.map(u=>`<div class="chartrow"><span>${u}</span><div class="charttrack"><div class="chartbar" style="width:${byUser[u]/max*100}%"></div></div><span class="chartvalue">${money(byUser[u])}</span></div>`).join('');const sorted=[...state.entries].sort((a,b)=>String(b.date).localeCompare(String(a.date))||(Number(b.created)||0)-(Number(a.created)||0));$('recent').innerHTML=sorted.slice(0,4).map(entryHTML).join('')||'<p class="hint">尚未有交易。</p>';$('entries').innerHTML=sorted.filter(e=>sameMonth(e,$('filterMonth').value)&&($('filterType').value==='all'||e.type===$('filterType').value)).map(entryHTML).join('')||'<p class="hint">這個月份沒有符合條件的交易。</p>';$('budgets').innerHTML=Object.entries(state.budgets).map(([name,b])=>{const used=originalSum(exp.filter(e=>e.category===name),b.currency),pct=b.limit?Math.min(100,used/b.limit*100):0;return `<div class="budget"><div class="row"><div><b>${escapeHTML(name)}</b><div class="budget-money">${money(b.limit,b.currency)}</div></div><div class="tools"><button type="button" class="secondary" data-edit-budget="${escapeHTML(name)}">修改</button><button type="button" class="danger" data-delete-budget="${escapeHTML(name)}">刪除</button></div></div><div class="bar"><i class="${used>b.limit?'over':''}" style="width:${pct}%"></i></div><span class="hint">已用 ${money(used,b.currency)}／${money(b.limit,b.currency)}${used>b.limit?' · 超出 '+money(used-b.limit,b.currency):''}</span></div>`}).join('')||'<p class="hint">尚未設定預算。</p>'}
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value),rate=$('currency').value==='CNY'?Number($('txRate').value):1;if(!Number.isFinite(amount)||amount<=0||!Number.isFinite(rate)||rate<=0){alert('請輸入有效金額和匯率');return}const item={id:editingId||crypto.randomUUID(),created:editingId?(state.entries.find(x=>x.id===editingId)?.created||Date.now()):Date.now(),date:$('date').value,type:$('type').value,amount,currency:$('currency').value,rate,place:$('place').value,user:$('user').value,category:$('category').value,note:$('note').value.trim()};if(!/^\d{4}-\d{2}-\d{2}$/.test(item.date)){alert('請選擇日期');return}const i=state.entries.findIndex(x=>x.id===editingId);if(editingId&&i<0){alert('找不到交易');return}if(!commit(()=>{if(i<0)state.entries.push(item);else state.entries[i]=item}))return;resetForm();showTab('history')});$('cancelEdit').addEventListener('click',()=>{resetForm();showTab('history')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-edit],[data-delete]');if(!b)return;const id=b.dataset.edit??b.dataset.delete,item=state.entries.find(x=>x.id===id);if(!item)return;if(b.hasAttribute('data-delete')){if(confirm(`刪除 ${item.date}「${item.category}」${money(item.amount,item.currency)}？`))commit(()=>{state.entries=state.entries.filter(x=>x.id!==id)});return}editingId=id;$('type').value=item.type;categories();if(![...$('category').options].some(o=>o.value===item.category))$('category').add(new Option(item.category,item.category));$('category').value=item.category;$('date').value=item.date;$('amount').value=item.amount;$('currency').value=item.currency;$('place').value=item.place;$('user').value=users.includes(item.user)?item.user:'自己';$('note').value=item.note||'';$('txRate').value=item.rate;$('formTitle').textContent='修改交易';$('submitEntry').textContent='儲存修改';$('cancelEdit').classList.remove('hidden');rateUI();showTab('add')});
function resetBudget(){editingBudget=null;$('budgetForm').reset();$('budgetCurrency').value='HKD';$('budgetTitle').textContent='新增預算';$('budgetSubmit').textContent='新增預算';$('cancelBudget').classList.add('hidden')}$('budgetForm').addEventListener('submit',e=>{e.preventDefault();const name=$('budgetName').value.trim(),raw=$('budgetLimit').value,limit=Number(raw),currency=$('budgetCurrency').value;if(!name||raw===''||!Number.isFinite(limit)||limit<0){alert('請輸入分類及有效額度');return}if(name!==editingBudget&&Object.hasOwn(state.budgets,name)){alert('分類已有預算，請直接修改');return}const old=editingBudget;if(!commit(()=>{if(old&&old!==name)delete state.budgets[old];state.budgets[name]={limit,currency}}))return;resetBudget();categories()});$('cancelBudget').addEventListener('click',resetBudget);document.addEventListener('click',e=>{const b=e.target.closest('[data-edit-budget],[data-delete-budget]');if(!b)return;const name=b.dataset.editBudget??b.dataset.deleteBudget;if(!Object.hasOwn(state.budgets,name))return;if(b.hasAttribute('data-delete-budget')){if(confirm(`刪除「${name}」預算？交易會保留。`)){commit(()=>{delete state.budgets[name]});if(editingBudget===name)resetBudget();categories()}return}const val=state.budgets[name];editingBudget=name;$('budgetName').value=name;$('budgetLimit').value=val.limit;$('budgetCurrency').value=val.currency;$('budgetTitle').textContent='修改預算';$('budgetSubmit').textContent='儲存修改';$('cancelBudget').classList.remove('hidden');$('budgetName').focus()});
function installUI(){if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone){$('installArea').innerHTML='<p class="hint settingless">已以主畫面 App 模式開啟。</p>';return}$('installArea').innerHTML='<div class="card"><h2>加入主畫面</h2><p class="hint">Android 可使用「安裝」；iPhone/iPad 請在 Safari 點分享，再選「加入主畫面」。</p><button class="primary hidden" id="installBtn" type="button">安裝 App</button></div>';const btn=$('installBtn');if(deferredPrompt){btn.classList.remove('hidden');btn.addEventListener('click',async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installUI()})}}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installUI()});window.addEventListener('appinstalled',installUI);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
$('date').value=localToday();$('filterMonth').value=month();$('filterMonth').addEventListener('change',render);$('filterType').addEventListener('change',render);$('txRate').value=state.rate||'';categories();rateUI();render();installUI();updateRate();
</script></body></html>
